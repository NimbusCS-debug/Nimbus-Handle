<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus Voice</title>
<style>
:root{
  --bg:#16161d; --panel:#1c1c26; --panel-2:#23232f; --border:rgba(255,255,255,0.08);
  --text:#f1f1f5; --muted:#9a9aab; --accent:#6d6af2; --green:#4cd787; --red:#ef5b5b; --amber:#f2a93b;
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%;}
body{font-family:Inter,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center;}
.wrap{width:100%; max-width:460px; height:100%; display:flex; flex-direction:column; padding:18px;}
header{display:flex; align-items:center; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--border);}
.logo{width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,#7a6cf5,#e8a458); display:grid; place-items:center; flex:none;}
.title{font-weight:700; font-size:16px;}
.sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
#people{flex:1; overflow-y:auto; padding:14px 0; display:flex; flex-direction:column; gap:8px;}
.person{display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--panel); border:1px solid var(--border); border-radius:12px;}
.av{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:14px; color:#0b0c10; flex:none; box-shadow:0 0 0 0 var(--green); transition:box-shadow .12s ease;}
.person.speaking .av{box-shadow:0 0 0 3px var(--green);}
.pname{flex:1; min-width:0; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pstate{font-size:12px; color:var(--muted);}
.pstate.ok{color:var(--green);} .pstate.bad{color:var(--red);}
#note{min-height:20px; font-size:12.5px; color:var(--amber); line-height:1.5; padding-bottom:8px;}
#note.err{color:var(--red);}
footer{display:flex; gap:10px; padding-top:12px; border-top:1px solid var(--border);}
button.sm{flex:none;padding:0;}
.av{background-size:cover !important;background-position:center !important;cursor:pointer;overflow:hidden;}
.pname{cursor:pointer;}
.pmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
.vol{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);}
.vol input{flex:1;accent-color:var(--accent);height:4px;}
#prof{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;}
#prof.on{display:flex;}
.pc{width:340px;max-width:100%;background:var(--panel);border-radius:14px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.55);max-height:92vh;overflow-y:auto;}
.pc .ban{height:70px;}
.pc .pav{position:absolute;left:18px;top:36px;width:72px;height:72px;border-radius:50%;border:5px solid var(--panel);display:grid;place-items:center;font-size:24px;font-weight:700;color:#0b0c10;background-size:cover;background-position:center;}
.pc .x{position:absolute;right:8px;top:6px;width:26px;height:26px;border-radius:50%;padding:0;background:rgba(0,0,0,.4);border:none;color:#fff;font-size:12px;}
.pc .pb{padding:44px 18px 4px;}
.pc .nm{font-size:19px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.pc .tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--panel-2);}
.pc .box{background:var(--panel-2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px;}
.pc .box h4{margin:0 0 5px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
.pc .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.pc .chip{font-size:11.5px;padding:2px 8px;border-radius:10px;background:rgba(109,106,242,.22);}
.pc .foot{margin-top:12px;padding:11px 18px;background:rgba(0,0,0,.2);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;}
button{flex:1; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;}
button:hover{border-color:rgba(255,255,255,.25);}
button.muted{background:var(--red); border-color:var(--red); color:#fff;}
button.danger{background:#3a2226; border-color:#5a2b30; color:#ff9a9a;}
button.danger:hover{background:var(--red); color:#fff;}
button:disabled{opacity:.5; cursor:default;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="#15151c"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></div>
    <div><div class="title" id="title">Voice</div><div class="sub" id="status">Starting...</div></div>
  </header>
  <div id="people"></div>
  <div id="note"></div>
  <footer>
    <button id="muteBtn" disabled>Mute</button>
    <button id="leaveBtn" class="danger">Leave</button>
  </footer>
</div>

<div id="prof"></div>
<script>
(function(){
var H = new URLSearchParams(location.hash.slice(1));
var API = H.get('u') || '', CH = H.get('c') || '', CHNAME = H.get('n') || 'voice', TOKEN = H.get('t') || '';
var COLORS = ['#6E6FF2','#F2A93B','#4CD787','#EF5B5B','#3BB0F2','#F2799E','#8CE07A','#C792EA'];
var $ = function(id){ return document.getElementById(id); };
$('title').textContent = '🔊 ' + CHNAME;

var avatars = {}, avAsked = {}, vols = {};
try{ vols = JSON.parse(localStorage.getItem('nimbus-vol') || '{}') || {}; }catch(e){}
function volOf(name){ var v = vols[String(name).toLowerCase()]; return typeof v === 'number' ? v : 100; }
var me = null, local = null, iceServers = [], peers = {}, left = false, muted = false, pollFails = 0;

function say(t){ $('status').textContent = t; }
function note(t, err){ $('note').textContent = t || ''; $('note').className = err ? 'err' : ''; }
function colorFor(name){ var h = 0; for(var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0; return COLORS[h % COLORS.length]; }

// ----- talking to Apps Script (text/plain keeps the browser from sending a preflight request) -----
function okApi(){ return /^https:\/\/script\.google(usercontent)?\.com\//.test(API) || /^http:\/\/(localhost|127\.0\.0\.1)[:\/]/.test(API); }
function api(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error || 'Request failed.'); return j.value; });
}

// ----- the list of people -----
function render(){
  var box = $('people');
  box.innerHTML = '';
  function row(id, name, state, cls, isMe){
    var d = document.createElement('div');
    d.className = 'person'; d.id = 'row-' + id;
    var av = document.createElement('div');
    av.className = 'av'; av.title = 'View profile';
    if(avatars[name]) av.style.background = 'url("' + avatars[name] + '")';
    else { av.style.background = colorFor(name); av.textContent = name.slice(0, 2).toUpperCase(); }
    av.addEventListener('click', function(){ openProfile(name); });
    var mid = document.createElement('div'); mid.className = 'pmid';
    var n = document.createElement('div');
    n.className = 'pname'; n.textContent = name + (isMe ? ' (you)' : '');
    n.addEventListener('click', function(){ openProfile(name); });
    mid.appendChild(n);
    if(!isMe){
      var vw = document.createElement('div'); vw.className = 'vol';
      var lab = document.createElement('span'); lab.textContent = '🔊';
      var sl = document.createElement('input'); sl.type = 'range'; sl.min = 0; sl.max = 100; sl.value = volOf(name); sl.setAttribute('aria-label', 'Volume for ' + name);
      var pc = document.createElement('span'); pc.style.width = '32px'; pc.style.textAlign = 'right'; pc.textContent = sl.value + '%';
      sl.addEventListener('input', function(){
        var val = +sl.value; pc.textContent = val + '%';
        vols[name.toLowerCase()] = val;
        try{ localStorage.setItem('nimbus-vol', JSON.stringify(vols)); }catch(e){}
        if(peers[id] && peers[id].audio) peers[id].audio.volume = val / 100;
      });
      vw.appendChild(lab); vw.appendChild(sl); vw.appendChild(pc); mid.appendChild(vw);
    }
    var s = document.createElement('div');
    s.className = 'pstate ' + (cls || ''); s.textContent = state;
    d.appendChild(av); d.appendChild(mid); d.appendChild(s);
    box.appendChild(d);
  }
  if(me) row('me', me.name, muted ? 'muted' : 'connected', muted ? 'bad' : 'ok', true);
  Object.keys(peers).forEach(function(id){
    var p = peers[id], st = p.failed ? "can't connect" : (p.state === 'connected' ? 'connected' : 'connecting...');
    row(id, p.name, st, p.failed ? 'bad' : (p.state === 'connected' ? 'ok' : ''), false);
  });
  var names = []; if(me) names.push(me.name); Object.keys(peers).forEach(function(id){ names.push(peers[id].name); });
  var need = names.filter(function(x){ return !avAsked[x]; });
  if(need.length){ need.forEach(function(x){ avAsked[x] = 1; }); api('chatAvatars', need).then(function(m){ var any = false; Object.keys(m || {}).forEach(function(k){ avatars[k] = m[k]; any = true; }); if(any) render(); }).catch(function(){}); }
  var n = Object.keys(peers).length + 1;
  say(n === 1 ? "You're the only one here" : n + ' people in the call');
}

// ----- profiles (same card as in chat) -----
function monthsSince(ts){ var a = new Date(ts), b = new Date(); var m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()); if(b.getDate() < a.getDate()) m--; return Math.max(0, m); }
function ageBadge(ts){ var m = monthsSince(ts); if(m < 1) return 'New member'; if(m < 12) return m + (m === 1 ? ' month' : ' months'); var y = Math.floor(m / 12); return y + (y === 1 ? ' year' : ' years'); }
function ago(ts){ var s = Math.max(1, Math.floor((Date.now() - ts) / 1000)); if(s < 60) return 'just now'; var m = Math.floor(s / 60); if(m < 60) return m + ' min ago'; var h = Math.floor(m / 60); if(h < 24) return h + ' hr ago'; var d = Math.floor(h / 24); if(d < 30) return d + ' day' + (d > 1 ? 's' : '') + ' ago'; var mo = Math.floor(d / 30); if(mo < 12) return mo + ' month' + (mo > 1 ? 's' : '') + ' ago'; var y = Math.floor(mo / 12); return y + ' year' + (y > 1 ? 's' : '') + ' ago'; }
function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
function openProfile(name){
  var pf = $('prof'); pf.classList.add('on'); pf.innerHTML = ''; pf.appendChild(el('div', 'pc', 'Loading...')).style.padding = '30px';
  api('chatGetProfile', name).then(function(p){
    var card = el('div', 'pc'), color = colorFor(p.name);
    var ban = el('div', 'ban'); ban.style.background = 'linear-gradient(135deg,' + color + ',#1b1b28)';
    var av = el('div', 'pav'); if(avatars[p.name]) av.style.backgroundImage = 'url("' + avatars[p.name] + '")'; else { av.style.background = color; av.textContent = p.name.slice(0, 2).toUpperCase(); }
    var x = el('button', 'x sm', '\u2715'); x.addEventListener('click', function(){ pf.classList.remove('on'); });
    var body = el('div', 'pb'), nm = el('div', 'nm'); nm.appendChild(el('span', '', p.name));
    if(p.admin) { var t = el('span', 'tag', 'ADMIN'); t.style.color = 'var(--amber)'; nm.appendChild(t); }
    if(p.guest) nm.appendChild(el('span', 'tag', 'GUEST'));
    ((p.badges && p.badges.account) || []).forEach(function(b){ var t = el('span', 'tag', b.name.toUpperCase()); t.style.color = b.color; t.style.background = b.color + '26'; nm.appendChild(t); });
    body.appendChild(nm);
    if(p.guest){ body.appendChild(el('div', 'box', 'Guests do not have profiles.')); }
    else {
      var bio = el('div', 'box'); bio.appendChild(el('h4', '', 'About me')); var bt = el('div', '', p.bio || 'No description yet.'); bt.style.whiteSpace = 'pre-wrap'; if(!p.bio) bt.style.opacity = '.6'; bio.appendChild(bt); body.appendChild(bio);
      if(p.joined > 1e12){
        var sn = el('div', 'box'); sn.appendChild(el('h4', '', 'Member since'));
        sn.appendChild(el('div', '', new Date(p.joined).toLocaleDateString([], { year: 'numeric', month: 'long', day: 'numeric' })));
        var ch = el('div', 'chips'), ab = el('span', 'chip', ageBadge(p.joined)); if(monthsSince(p.joined) >= 12){ ab.style.background = 'rgba(232,164,88,.25)'; ab.style.color = '#f0c27a'; } ch.appendChild(ab); sn.appendChild(ch); body.appendChild(sn);
      }
      var minis = (p.badges && p.badges.mini) || [];
      if(minis.length){ var mb = el('div', 'box'); mb.appendChild(el('h4', '', 'Badges')); var mc = el('div', 'chips'); minis.forEach(function(b){ var c = el('span', 'chip', b.name); c.style.background = b.color + '38'; c.style.color = b.color; mc.appendChild(c); }); mb.appendChild(mc); body.appendChild(mb); }
    }
    var foot = el('div', 'foot'); foot.appendChild(el('span', '', p.lastGame ? '\uD83C\uDFAE Last played ' + p.lastGame : '\uD83C\uDFAE No games played yet'));
    if(p.lastGame) foot.appendChild(el('span', '', ago(p.lastGameTs)));
    card.appendChild(ban); card.appendChild(av); card.appendChild(x); card.appendChild(body); card.appendChild(foot);
    pf.innerHTML = ''; pf.appendChild(card);
  }).catch(function(e){ pf.classList.remove('on'); note(e.message, true); });
}
$('prof').addEventListener('mousedown', function(e){ if(e.target === $('prof')) $('prof').classList.remove('on'); });

// ----- speaking rings -----
var ac = null;
function level(stream){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    ac = ac || new AC();
    var an = ac.createAnalyser(); an.fftSize = 512;
    ac.createMediaStreamSource(stream).connect(an);
    var buf = new Uint8Array(an.fftSize);
    return function(){
      an.getByteTimeDomainData(buf);
      var s = 0;
      for(var i = 0; i < buf.length; i++){ var v = (buf[i] - 128) / 128; s += v * v; }
      return Math.sqrt(s / buf.length);
    };
  }catch(e){ return null; }
}
var myLevel = null;
setInterval(function(){
  var r = $('row-me');
  if(r) r.classList.toggle('speaking', !muted && !!myLevel && myLevel() > 0.04);
  Object.keys(peers).forEach(function(id){
    var el = $('row-' + id), p = peers[id];
    if(el) el.classList.toggle('speaking', !!p.level && p.level() > 0.04);
  });
}, 120);

// ----- WebRTC -----
function iceDone(pc, ms){
  return new Promise(function(res){
    if(pc.iceGatheringState === 'complete') return res();
    var t = setTimeout(done, ms);
    function chk(){ if(pc.iceGatheringState === 'complete') done(); }
    function done(){ clearTimeout(t); pc.removeEventListener('icegatheringstatechange', chk); res(); }
    pc.addEventListener('icegatheringstatechange', chk);
  });
}
function newPC(p){
  if(p.pc){ try{ p.pc.close(); }catch(e){} }
  var pc = new RTCPeerConnection({ iceServers: iceServers });
  p.pc = pc;
  local.getTracks().forEach(function(t){ pc.addTrack(t, local); });
  pc.ontrack = function(e){
    var stream = e.streams[0];
    if(!p.audio){ p.audio = document.createElement('audio'); p.audio.autoplay = true; p.audio.setAttribute('playsinline', ''); p.audio.volume = volOf(p.name) / 100; document.body.appendChild(p.audio); }
    p.audio.srcObject = stream;
    var pr = p.audio.play();
    if(pr && pr.catch) pr.catch(function(){ note('Click anywhere on this page to turn on sound.'); });
    p.level = level(stream);
  };
  pc.onconnectionstatechange = function(){
    p.state = pc.connectionState;
    if(p.state === 'connected'){ p.failed = false; note(''); }
    render();
  };
  return pc;
}
function sendSignal(to, type, desc){
  return api('voiceSignal', TOKEN, CH, me.peerId, to, { t: type, d: JSON.stringify({ type: desc.type, sdp: desc.sdp }) });
}
function callPeer(p){
  p.offerer = true; p.startedAt = Date.now();
  var pc = newPC(p);
  return pc.createOffer()
    .then(function(o){ return pc.setLocalDescription(o); })
    .then(function(){ return iceDone(pc, 2500); })
    .then(function(){ return sendSignal(p.id, 'offer', pc.localDescription); })
    .catch(function(e){ note('Could not call ' + p.name + ': ' + e.message, true); });
}
function answerPeer(p, desc){
  p.offerer = false;
  var pc = newPC(p);
  return pc.setRemoteDescription(desc)
    .then(function(){ return pc.createAnswer(); })
    .then(function(a){ return pc.setLocalDescription(a); })
    .then(function(){ return iceDone(pc, 2500); })
    .then(function(){ return sendSignal(p.id, 'answer', pc.localDescription); })
    .catch(function(e){ note('Could not answer ' + p.name + ': ' + e.message, true); });
}
function closePeer(id){
  var p = peers[id];
  if(!p) return;
  try{ p.pc && p.pc.close(); }catch(e){}
  if(p.audio){ p.audio.srcObject = null; p.audio.remove(); }
  delete peers[id];
}
function syncPeers(list){
  var seen = {};
  list.forEach(function(x){
    seen[x.id] = true;
    if(!peers[x.id]){
      peers[x.id] = { id: x.id, name: x.n, seq: x.s, state: 'new', attempts: 0 };
      if(x.s < me.seq) callPeer(peers[x.id]);        // whoever joined later makes the call
    }
  });
  Object.keys(peers).forEach(function(id){ if(!seen[id]) closePeer(id); });
}
function handleSignal(s){
  var p = peers[s.from];
  if(!p) return;
  var desc;
  try{ desc = JSON.parse(s.d); }catch(e){ return; }
  if(s.t === 'offer') answerPeer(p, desc);
  else if(s.t === 'answer' && p.pc && p.pc.signalingState === 'have-local-offer') p.pc.setRemoteDescription(desc).catch(function(){});
}
// calls that never connect are retried a couple of times, then reported
setInterval(function(){
  Object.keys(peers).forEach(function(id){
    var p = peers[id];
    if(p.state === 'connected' || !p.offerer || !p.startedAt || Date.now() - p.startedAt < 15000) return;
    if(p.attempts < 2){ p.attempts++; callPeer(p); }
    else if(!p.failed){
      p.failed = true; render();
      note("Couldn't connect to " + p.name + ". One of your networks may block voice calls.", true);
    }
  });
}, 3000);

// ----- polling -----
function poll(){
  if(left) return;
  api('voicePoll', TOKEN, CH, me.peerId).then(function(r){
    pollFails = 0;
    syncPeers(r.peers || []);
    (r.signals || []).forEach(handleSignal);
    render();
    setTimeout(poll, 1200);
  }).catch(function(e){
    if(/left the voice|log in again/i.test(e.message)){ left = true; note(e.message, true); say('Disconnected'); return; }
    if(++pollFails >= 6){ note('Lost connection to the server. Close this window and join again.', true); return; }
    setTimeout(poll, 2000);
  });
}

// ----- buttons -----
$('muteBtn').addEventListener('click', function(){
  muted = !muted;
  local.getAudioTracks().forEach(function(t){ t.enabled = !muted; });
  $('muteBtn').textContent = muted ? 'Unmute' : 'Mute';
  $('muteBtn').className = muted ? 'muted' : '';
  render();
});
function leave(){
  if(left && !me) return;
  left = true;
  try{
    if(me) navigator.sendBeacon(API, JSON.stringify({ fn: 'voiceLeave', args: [TOKEN, CH, me.peerId] }));
  }catch(e){}
}
$('leaveBtn').addEventListener('click', function(){
  leave();
  Object.keys(peers).forEach(closePeer);
  if(local) local.getTracks().forEach(function(t){ t.stop(); });
  say('You left the call');
  $('leaveBtn').disabled = true; $('muteBtn').disabled = true;
  window.close();
});
window.addEventListener('pagehide', leave);
document.addEventListener('click', function(){
  if(ac && ac.state === 'suspended') ac.resume();
  Object.keys(peers).forEach(function(id){ var a = peers[id].audio; if(a && a.paused) a.play().catch(function(){}); });
  if($('note').textContent.indexOf('Click anywhere') === 0) note('');
});

// ----- start -----
function start(){
  if(!API || !CH || !TOKEN || !okApi()){ note('This link is incomplete. Open the voice channel again from the chat.', true); say('Cannot start'); return; }
  if(!window.RTCPeerConnection || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    note("This browser can't do voice calls.", true); say('Cannot start'); return;
  }
  say('Asking for your microphone...');
  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false })
    .then(function(stream){
      local = stream;
      say('Joining...');
      return api('voiceJoin', TOKEN, CH);
    })
    .then(function(j){
      me = j; iceServers = j.ice || [];
      myLevel = level(local);
      $('muteBtn').disabled = false;
      render();
      syncPeers(j.peers || []);
      render();
      setTimeout(poll, 800);
    })
    .catch(function(e){
      say('Cannot start');
      if(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) note('The microphone is blocked. Click the lock icon in the address bar, allow the microphone, then reload this page.', true);
      else if(e && e.name === 'NotFoundError') note('No microphone was found.', true);
      else note((e && e.message) || 'Could not join.', true);
      if(local) local.getTracks().forEach(function(t){ t.stop(); });
    });
}
start();
})();
</script>
</body>
</html>
